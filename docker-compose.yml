services:
  postgres:
    image: postgres:16-alpine
    container_name: vetpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vetpulse
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - vetpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d vetpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vetpulse_pgdata:
